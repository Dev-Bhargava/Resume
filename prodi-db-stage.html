<!DOCTYPE html>
<html>
<head>
  <title>ProDI Embed Test</title>
  <style>
    body {
      margin: 0;
      font-family: sans-serif;
    }

    iframe {
      width: 100%;
      height: 100vh;
      border: none;
      display: block;
    }
  </style>
</head>
<body>
  <iframe
    id="prodi-embed"
    src="https://idpbind-stage.vercel.app"
  ></iframe>

  <script>
    const iframe = document.getElementById("prodi-embed");
    const iframeUrl = new URL(iframe.getAttribute("src"), window.location.href);
    const iframeOrigin = iframeUrl.origin;

    function getInitialBasePath() {
      const currentPath = window.location.pathname;

      // If this HTML file lives at /prodi-db-stage/embed.html
      // -> base path should be /prodi-db-stage
      const withoutFile = currentPath.replace(/\/[^/]*\.[^/]+$/, "");

      return withoutFile === "/" ? "" : withoutFile.replace(/\/+$/, "");
    }

    const parentBasePath = getInitialBasePath();

    window.addEventListener("message", function (event) {
      if (event.origin !== iframeOrigin) return;

      const data = event.data;
      if (!data || data.type !== "PRODI_EMBED_ROUTE_CHANGE") return;

      const route = typeof data.route === "string" ? data.route : "/";
      const normalizedRoute = route.startsWith("/") ? route : `/${route}`;
      const nextPath = `${parentBasePath}${normalizedRoute}`;

      if (window.location.pathname === nextPath) return;

      window.history.pushState(
        { prodiRoute: normalizedRoute },
        "",
        nextPath
      );
    });
  </script>
</body>
</html>
