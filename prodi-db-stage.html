<!DOCTYPE html>
<html>
<head>
  <title>ProDI Embed Test</title>
  <style>
    body { margin: 0; font-family: sans-serif; }
    #url-bar {
      padding: 12px 16px;
      background: #1e293b;
      color: #94a3b8;
      font-size: 13px;
      font-family: monospace;
    }
    #url-bar span { color: #38bdf8; }
    iframe {
      width: 100%;
      height: calc(100vh - 48px);
      border: none;
      display: block;
    }
  </style>
</head>
<body>
  <iframe
    id="prodi-embed"
    src="https://idpbind-stage.vercel.app"
  ></iframe>

  <script>
    const iframe = document.getElementById("prodi-embed");
    const iframeUrl = new URL(iframe.getAttribute("src"), window.location.href);
    const iframeOrigin = iframeUrl.origin;
  
    function getParentBasePath() {
      return window.location.pathname
        .replace(/\/[^/]*\.[^/]+$/, "")
        .replace(/\/+$/, "");
    }
  
    window.addEventListener("message", function (event) {
      if (event.origin !== iframeOrigin) return;
  
      const data = event.data;
      if (!data || data.type !== "PRODI_EMBED_ROUTE_CHANGE") return;
  
      const route = typeof data.route === "string" ? data.route : "/";
      const basePath = getParentBasePath();
      const parentPath = `${basePath}${route}`;
  
      window.history.pushState({ prodiRoute: route }, "", parentPath);
    });
  </script>
</body>
</html>
