<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>ProDI Embed</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    iframe {
      display: block;
      width: 100%;
      height: 100vh;
      border: 0;
    }
  </style>
</head>
<body>
  <iframe id="prodi-embed"></iframe>

  <script>
    const APP_ORIGIN = "https://idpbind-stage.vercel.app";
    const iframe = document.getElementById("prodi-embed");
    const iframeOrigin = new URL(APP_ORIGIN).origin;

    function normalizeRoute(route) {
      if (!route) return "/";
      return route.startsWith("/") ? route : `/${route}`;
    }

    function getRouteFromHash() {
      const hash = window.location.hash || "";
      const raw = hash.startsWith("#") ? hash.slice(1) : hash;
      return normalizeRoute(raw || "/");
    }

    function setIframeFromHash() {
      const route = getRouteFromHash();
      const nextSrc = APP_ORIGIN + route;

      if (iframe.getAttribute("src") !== nextSrc) {
        iframe.setAttribute("src", nextSrc);
      }
    }

    window.addEventListener("message", function (event) {
      if (event.origin !== iframeOrigin) return;

      const data = event.data;
      if (!data || data.type !== "PRODI_EMBED_ROUTE_CHANGE") return;

      const route = normalizeRoute(data.route || "/");
      const nextHash = `#${route}`;

      if (window.location.hash !== nextHash) {
        window.history.pushState({ prodiRoute: route }, "", nextHash);
      }
    });

    window.addEventListener("popstate", function () {
      setIframeFromHash();
    });

    window.addEventListener("hashchange", function () {
      setIframeFromHash();
    });

    setIframeFromHash();
  </script>
</body>
</html>
