<!DOCTYPE html>
<html>
<head>
  <title>ProDI Embed Test</title>
  <style>
    body { margin: 0; font-family: sans-serif; }
    #url-bar {
      padding: 12px 16px;
      background: #1e293b;
      color: #94a3b8;
      font-size: 13px;
      font-family: monospace;
    }
    #url-bar span { color: #38bdf8; }
    iframe { width: 100%; height: calc(100vh - 48px); border: none; display: block; }
  </style>
</head>
<body>

  <div id="url-bar">
    Parent URL: <span id="url-display">/</span>
  </div>

  <iframe
    id="prodi-embed"
    src="http://localhost:3000"
  ></iframe>

  <script>
    const iframe = document.getElementById("prodi-embed");
    const urlDisplay = document.getElementById("url-display");

    // Accept messages from localhost during local testing
    window.addEventListener("message", function (event) {
      // Allow localhost and file:// during dev
      const allowedOrigins = [
        "http://localhost:3000",
        "http://localhost:3001",
        "http://127.0.0.1:3000",
        "https://idpbind-stage.vercel.app/",
      ];

      if (!allowedOrigins.includes(event.origin)) return;

      const data = event.data;
      if (!data || data.type !== "PRODI_EMBED_ROUTE_CHANGE") return;

      // Update displayed URL — simulates parent pushState
      urlDisplay.textContent = data.route;
      console.log("[parent] route changed to:", data.route);
    });
  </script>

</body>
</html>
