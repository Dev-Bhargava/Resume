<!DOCTYPE html>
<html>
  <head>
    <title>NIT Prodi-DB | Home</title>
    <style>
        html,
        body {
          margin: 0;
          height: 100%;
          overflow: hidden;
        }
    
        iframe {
          display: block;
          width: 100%;
          height: 100vh;
          border: none;
        }
      </style>
  </head>
  <body>
    <iframe
      id="prodi-embed"
      src="https://idpbind-stage.vercel.app"
    ></iframe>

    <script>
      const iframe = document.getElementById("prodi-embed");
      const urlDisplay = document.getElementById("url-display");

      const iframeUrl = new URL(iframe.src, window.location.href);
      const iframeOrigin = iframeUrl.origin;

      function updateDisplayedUrl() {
        urlDisplay.textContent =
          window.location.pathname +
          window.location.search +
          window.location.hash;
      }

      updateDisplayedUrl();

      window.addEventListener("message", function (event) {
        if (event.origin !== iframeOrigin) return;

        const data = event.data;
        if (!data || data.type !== "PRODI_EMBED_ROUTE_CHANGE") return;

        const route = typeof data.route === "string" ? data.route : "/";
        const parentPath = `/prodi-db-stage${route}`;

        window.history.pushState({ prodiRoute: route }, "", parentPath);
        updateDisplayedUrl();
      });

      window.addEventListener("popstate", function () {
        updateDisplayedUrl();

        const currentPath = window.location.pathname;
        const basePrefix = "/prodi-db-stage";
        const route = currentPath.startsWith(basePrefix)
          ? currentPath.slice(basePrefix.length) || "/"
          : "/";

        if (iframe.contentWindow) {
          iframe.contentWindow.postMessage(
            {
              type: "PRODI_EMBED_NAVIGATE",
              route,
            },
            iframeOrigin
          );
        }
      });
    </script>
  </body>
</html>
