<!DOCTYPE html>
<html>
<head>
  <title>ProDI Embed</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      font-family: sans-serif;
    }

    iframe {
      width: 100%;
      height: 100vh;
      border: none;
      display: block;
    }
  </style>
</head>
<body>
  <iframe id="prodi-embed"></iframe>

  <script>
    const iframe = document.getElementById("prodi-embed");
    const APP_ORIGIN = "https://idpbind-stage.vercel.app";
    const BASE_PATH = "/prodi-db-stage";

    function getChildRouteFromParentUrl() {
      const path = window.location.pathname;

      if (!path.startsWith(BASE_PATH)) {
        return "/";
      }

      const childRoute = path.slice(BASE_PATH.length) || "/";
      return childRoute.startsWith("/") ? childRoute : `/${childRoute}`;
    }

    function setIframeSrcFromParentUrl() {
      const childRoute = getChildRouteFromParentUrl();
      iframe.src = `${APP_ORIGIN}${childRoute}`;
    }

    const iframeOrigin = new URL(APP_ORIGIN).origin;

    window.addEventListener("message", function (event) {
      if (event.origin !== iframeOrigin) return;

      const data = event.data;
      if (!data || data.type !== "PRODI_EMBED_ROUTE_CHANGE") return;

      const route = typeof data.route === "string" ? data.route : "/";
      const normalizedRoute = route.startsWith("/") ? route : `/${route}`;
      const nextPath = `${BASE_PATH}${normalizedRoute}`;

      if (window.location.pathname !== nextPath) {
        window.history.pushState({ prodiRoute: normalizedRoute }, "", nextPath);
      }
    });

    window.addEventListener("popstate", function () {
      setIframeSrcFromParentUrl();
    });

    setIframeSrcFromParentUrl();
  </script>
</body>
</html>
