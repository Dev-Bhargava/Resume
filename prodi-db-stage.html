<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>ProDI Embed</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: #fff;
    }

    iframe {
      display: block;
      width: 100%;
      height: 100vh;
      border: 0;
    }
  </style>
</head>
<body>
  <iframe id="prodi-embed"></iframe>

  <script>
    const APP_ORIGIN = "https://idpbind-stage.vercel.app";
    const BASE_PATH = "/prodi-db-stage";

    const iframe = document.getElementById("prodi-embed");
    const iframeOrigin = new URL(APP_ORIGIN).origin;

    function getChildRouteFromParentPath() {
      const path = window.location.pathname;

      if (!path.startsWith(BASE_PATH)) {
        return "/";
      }

      let childRoute = path.slice(BASE_PATH.length) || "/";

      if (!childRoute.startsWith("/")) {
        childRoute = "/" + childRoute;
      }

      return childRoute;
    }

    function buildIframeSrc() {
      const childRoute = getChildRouteFromParentPath();
      return APP_ORIGIN + childRoute;
    }

    function syncIframeToParentUrl() {
      const nextSrc = buildIframeSrc();

      if (iframe.src !== nextSrc) {
        iframe.src = nextSrc;
      }
    }

    window.addEventListener("message", function (event) {
      if (event.origin !== iframeOrigin) return;

      const data = event.data;
      if (!data || data.type !== "PRODI_EMBED_ROUTE_CHANGE") return;

      const route = typeof data.route === "string" ? data.route : "/";
      const normalizedRoute = route.startsWith("/") ? route : `/${route}`;
      const nextPath = `${BASE_PATH}${normalizedRoute}`;

      if (window.location.pathname !== nextPath) {
        window.history.pushState({ prodiRoute: normalizedRoute }, "", nextPath);
      }
    });

    window.addEventListener("popstate", function () {
      syncIframeToParentUrl();
    });

    syncIframeToParentUrl();
  </script>
</body>
</html>
