<!DOCTYPE html>
<html>
<head>
  <title>ProDI Embed Test</title>
  <style>
    html,
        body {
          margin: 0;
          height: 100%;
          overflow: hidden;
        }
    
        iframe {
          display: block;
          width: 100%;
          height: 100vh;
          border: none;
        }
  </style>
</head>
<body>
  <iframe
    id="prodi-embed"
    src="https://idpbind-stage.vercel.app"
  ></iframe>

  <script>
    const urlDisplay = document.getElementById("url-display");

    const allowedOrigins = [
      "http://localhost:3000",
      "http://localhost:3001",
      "http://127.0.0.1:3000",
      "https://idpbind-stage.vercel.app"
    ];

    function updateDisplayedUrl() {
      urlDisplay.textContent =
        window.location.pathname + window.location.search + window.location.hash;
    }

    updateDisplayedUrl();

    window.addEventListener("message", function (event) {
      if (!allowedOrigins.includes(event.origin)) return;

      const data = event.data;
      if (!data || data.type !== "PRODI_EMBED_ROUTE_CHANGE") return;

      const route = typeof data.route === "string" ? data.route : "/";
      const parentPath = `/prodi-db-stage${route}`;

      window.history.pushState(
        { prodiRoute: route },
        "",
        parentPath
      );

      updateDisplayedUrl();

      console.log("[parent] route changed to:", route);
      console.log("[parent] browser url is now:", window.location.href);
    });

    window.addEventListener("popstate", function () {
      updateDisplayedUrl();
    });
  </script>
</body>
</html>
